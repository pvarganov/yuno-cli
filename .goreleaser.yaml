version: 2

builds:
  - main: ./cmd/yuno-cli
    binary: yuno-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: yuno-cli
    repository:
      owner: pvarganov
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/pvarganov/yuno-cli"
    description: "CLI for the full Yuno REST API"
    binaries:
      - yuno-cli

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
